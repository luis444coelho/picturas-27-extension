worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Access log of /s3-video/ (ADD T-10): logs $uri, not $request_uri, because the
    # query string carries the presigned URL signature, which must not be logged.
    log_format video_s3 '$remote_addr [$time_local] "$request_method $uri" '
                        '$status $body_bytes_sent $request_time "$http_range"';

    # 1) Server principal, em HTTPS
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;

        # Configuração para o Frontend
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Configuração para o API Gateway
        location /api-gateway/ {
            rewrite ^/api-gateway/(.*)$ /$1 break;
            proxy_pass http://api_gateway:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

           # Adicionando cabeçalhos CORS
           add_header 'Access-Control-Allow-Origin' '*' always;
           add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
           add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, X-Project-Version, X-Caller-Id' always;
           add_header 'Access-Control-Expose-Headers' 'X-Project-Version' always;

            # Reescreve os caminhos para suportar o subpath
            sub_filter 'href="/' 'href="/api-gateway/';
            sub_filter 'src="/' 'src="/api-gateway/';
            sub_filter_once off;

           # Tratando requisições OPTIONS (preflight)
           if ($request_method = 'OPTIONS') {
             add_header 'Access-Control-Allow-Origin' '*';
             add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
             add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, X-Project-Version, X-Caller-Id';
             add_header 'Access-Control-Max-Age' 3600;
             return 204;
           }

        }

        # Configuração para o WebSocket Gateway
        location /socket.io {
            proxy_pass http://ws_gateway:4000;
    
            # Configurações necessárias para WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout para conexões WebSocket
            proxy_connect_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Cabeçalhos adicionais
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS para WebSockets
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Credentials true;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";

            if ($request_method = 'OPTIONS') {
                return 204;
        }
         }

        # Configuração para o serviço principal de object storage (SeaweedFS S3)
        location /s3/ {
            proxy_pass http://seaweedfs:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;


            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;

            # Reescreve os caminhos para suportar o subpath
            # sub_filter 'href="/' 'href="/s3/';
            # sub_filter 'src="/' 'src="/s3/';
            # sub_filter_once off;
        }

        # Video objects (ADD T-08, D-11): presigned PUT uploads up to 2 GB and GET
        # with Range for playback and download. The data does not go through the API Gateway.
        location /s3-video/ {
            proxy_pass http://seaweedfs:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;

            client_max_body_size 2g;
            proxy_request_buffering off;
            proxy_buffering off;

            access_log /var/log/nginx/access.log video_s3;
            # The error log always writes the full request, signature included,
            # and its format cannot change: keep only crit and above here (T-10, D-27).
            error_log /var/log/nginx/error.log crit;
        }

        # Configuração para o console (filer web UI do SeaweedFS)
        location /s3-console/ {
            rewrite ^/s3-console/(.*) /$1 break;
            proxy_pass http://seaweedfs:8888/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            chunked_transfer_encoding off;

            # Reescreve os caminhos para suportar o subpath
            sub_filter 'href="/' 'href="/s3-console/';
            sub_filter 'src="/' 'src="/s3-console/';
            sub_filter_once off;
        }

        # # Kibana (porta 5601)
        # location /kibana-service/ {
        #     proxy_pass http://kibana:5601/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #
        #     # Reescreve os caminhos para suportar o subpath
        #     sub_filter 'href="/' 'href="/kibana-service/';
        #     sub_filter 'src="/' 'src="/kibana-service/';
        #     sub_filter_once off;
        # }
        #
        #  # Elasticsearch (porta 9200)
        # location /elasticsearch/ {
        #     proxy_pass http://elasticsearch:9200/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #
        #     # Reescreve os caminhos para suportar o subpath
        #     sub_filter 'href="/' 'href="/elasticsearch/';
        #     sub_filter 'src="/' 'src="/elasticsearch/';
        #     sub_filter_once off;
        # }
        #
        # # Logstash (porta 12201, interface HTTP)
        # location /logstash/ {
        #     proxy_pass http://logstash:12201/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #
        #     # Reescreve os caminhos para suportar o subpath
        #     sub_filter 'href="/' 'href="/logstash/';
        #     sub_filter 'src="/' 'src="/logstash/';
        #     sub_filter_once off;
        # }
    }
}
